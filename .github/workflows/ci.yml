name: OphielSast Project CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            make gcc clang lld \
            python3 bc bison flex \
            pkg-config cpio gzip git \
            libssl-dev libelf-dev

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup component add rust-src

      - name: Build project
        run: |
          make setup
          make build

      - name: Run smoke test
        run: |
          [ -f bzImage ] && echo "Kernel image exists"
          [ -f rootfs.img ] && echo "Rootfs image exists"

          echo "Running smoke test (timeout 30s)..."
          timeout 30s make run-no-kvm 2>&1 | tee qemu.log || true

          if grep -q "Welcome to SAST Woc 2026" qemu.log; then
            echo "Smoke test passed: System booted successfully"
          else
            echo "Smoke test failed: System did not boot properly"
            cat qemu.log | tail -50
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bzImage
            rootfs.img
            output/
            *.ko
          retention-days: 7

      docker: 
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            submodules: recursive

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build Docker image
          run: |
            docker build -t ophielsast/woc2026-kernal:latest

        - name: Test Docker image
          run: |
            docker run --rm ophielsast/woc2026-kernal:latest echo "Docker image test passed"

        - name: Save Docker image
          run: |
            mkdir -p docker-images
          docker save ophielsast/woc2026-kernal:latest -o docker-images/woc2026-kernal.tar

        - name: Upload Docker image artifact
          uses: actions/upload-artifact@v4
          with:
            name: docker-image
            path: docker-images/
            retention-days: 7

